name: Build Zajel Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          mkdir -p project

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found"
            ls -la
            exit 1
          fi

          echo "Found project: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Find Gradle project and build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: gradlew not found in ZIP"
            find project -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$WRAPPER")
          chmod +x "$WRAPPER"
          cd "$PROJECT_DIR"

          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZajelChat-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
          
