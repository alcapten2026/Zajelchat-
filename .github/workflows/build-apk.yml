
name: Get Zajel Chat APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Download project files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p project output

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found"
            exit 1
          fi

          unzip -q "$ZIP_FILE" -d project

      - name: Find existing APK
        run: |
          APK=$(find project -type f -iname '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: No APK exists inside project ZIP"
            exit 1
          fi

          echo "Found APK: $APK"

          file "$APK"

          cp "$APK" output/ZajelChat.apk

          unzip -t output/ZajelChat.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZajelChat-APK
          path: output/ZajelChat.apk
          if-no-files-found: error
          retention-days: 7
